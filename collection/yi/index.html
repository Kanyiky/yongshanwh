<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医_中医方药与针灸诊法_五术典藏_庸善文化</title>
  <meta name="description" content="医者，意也，仁术也。察阴阳，辨五行，明脏腑经络。望闻问切以审其症，方药针砭以疗其疾。" />
  <link rel="canonical" href="https://yongshanwh.com/collection/yi/" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/nav-transition.css" />
    <link rel="stylesheet" href="../../css/collection-list.css" />

  <link rel="stylesheet" href="../../css/mobile.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="菜单">
      <label class="menu-btn" for="nav-toggle"><span></span><span></span><span class="sr">菜单</span></label>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item active" href="../">五术典藏</a>
        <a class="nav-item" href="../../yili/">易理明辨</a>
        <a class="nav-item" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-header" style="position:relative;">
        <div class="category-icon">
          <img src="../../images/yi.png" alt="医" />
        </div>
        <h1>医</h1>
        <p class="subtitle">诊法 · 方药 · 针砭 · 养生</p>
        <p class="intro">医者，意也，仁术也。察阴阳，辨五行，明脏腑经络。望闻问切以审其症，方药针砭以疗其疾。上医治未病，其要在调和气血，扶正祛邪。然疾病当求良医，此记不可代诊。</p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="在「医」分类中搜索..." />
      </div>

      <div class="resource-list" id="resourceList"></div>

      <a href="../" class="back-link">← 返回五术典藏</a>
    </main>
  </div>

  <script src="../../js/data.js"></script>
  <script>
    const currentCategory = "yi";

    function renderList(list) {
      const container = document.getElementById('resourceList');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-aux); padding:40px 0; opacity:0.6;">暂无匹配的资源</p>';
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="resource-card">
          <div class="resource-info">
            <h3>${item.title}</h3>
            <div class="meta">${item.categoryName}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="resource-actions">
            <a href="${item.link}" target="_blank" rel="noopener" class="btn btn-primary">获取资源</a>
          </div>
        </div>
      `).join('');
    }

    const categoryResources = resources.filter(r => r.category === currentCategory);
    renderList(categoryResources);

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const keyword = e.target.value.trim().toLowerCase();
      if (!keyword) {
        renderList(categoryResources);
        return;
      }
      renderList(categoryResources.filter(r => 
        r.title.toLowerCase().includes(keyword) || r.desc.toLowerCase().includes(keyword)
      ));
    });
  </script>
  <script src="../../js/nav-transition.js"></script>
  <script src="../../js/mobile-nav.js"></script>
</body>
</html>
