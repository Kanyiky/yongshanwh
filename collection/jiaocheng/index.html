<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能教程_百工技艺与实用手艺_五术典藏_庸善文化</title>
  <meta name="description" content="技艺者，立身之具也。弦歌可以养性，木作可以成器，百工各有所长。" />
  <link rel="canonical" href="https://yongshanwh.com/collection/jiaocheng/" />
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .category-icon {
      position: absolute;
      top: 0;
      right: 0;
      width: 110px;
      height: 110px;
      opacity: 0.1;
      pointer-events: none;
    }
    .category-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .resource-card {
      background: transparent;
      border-radius: 0;
      padding: 20px 0;
      border-bottom: 1px solid rgba(73,55,42,0.08);
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .resource-card:hover {
      transform: none;
      box-shadow: none;
      background: rgba(73,55,42,0.015);
    }
    .resource-info { flex: 1; min-width: 0; }
    .resource-card h3 {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .resource-card .meta {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .resource-card .desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.75;
    }
    .resource-actions { flex-shrink: 0; }
    .btn-primary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(73,55,42,0.25);
      font-size: 13px;
      letter-spacing: 2px;
      padding: 6px 16px;
    }
    .btn-primary:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .back-link {
      display: inline-block;
      margin-top: 40px;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--text-secondary);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.25s;
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item active" href="../">五术典藏</a>
        <a class="nav-item" href="../../yili/">易理明辨</a>
        <a class="nav-item" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-header" style="position:relative;">
        <div class="category-icon">
          <img src="../../images/jiaocheng.png" alt="技能教程" />
        </div>
        <h1>技能教程</h1>
        <p class="subtitle">技艺 · 木作 · 烹调 · 编程</p>
        <p class="intro">技艺者，立身之具也。弦歌可以养性，木作可以成器，电工通其理，手语达其意，烹调存其味，编程见其巧。百工各有所长，不必成系，但取其实用，日习一技，日增一能，所谓艺不压身，有备无患。</p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="在「技能教程」分类中搜索..." />
      </div>

      <div class="resource-list" id="resourceList"></div>

      <a href="../" class="back-link">← 返回五术典藏</a>
    </main>
  </div>

  <script src="../../js/data.js"></script>
  <script>
    const currentCategory = "jiaocheng";

    function renderList(list) {
      const container = document.getElementById('resourceList');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-aux); padding:40px 0; opacity:0.6;">暂无匹配的资源</p>';
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="resource-card">
          <div class="resource-info">
            <h3>${item.title}</h3>
            <div class="meta">${item.categoryName}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="resource-actions">
            <a href="${item.link}" target="_blank" rel="noopener" class="btn btn-primary">获取资源</a>
          </div>
        </div>
      `).join('');
    }

    const categoryResources = resources.filter(r => r.category === currentCategory);
    renderList(categoryResources);

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const keyword = e.target.value.trim().toLowerCase();
      if (!keyword) {
        renderList(categoryResources);
        return;
      }
      renderList(categoryResources.filter(r => 
        r.title.toLowerCase().includes(keyword) || r.desc.toLowerCase().includes(keyword)
      ));
    });
  </script>
</body>
</html>
