
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>五术典藏_古籍典籍与传统文化资源库_庸善文化</title>

  <link rel="canonical" href="https://yongshanwh.com/collection/" />

  <link rel="stylesheet" href="../css/style.css" />

  <link rel="stylesheet" href="../css/mobile.css" />

</head>
<body class="archive-page">
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>

      <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="菜单">
      <label class="menu-btn" for="nav-toggle"><span></span><span></span><span class="sr">菜单</span></label>
      <nav class="nav">
        <a class="nav-item" href="../">首页</a>
        <a class="nav-item active" href="./">五术典藏</a>
        <a class="nav-item" href="../yili/">易理明辨</a>
        <a class="nav-item" href="../xuanji/">五术玄机</a>
      </nav>
    </aside>

    <main class="main">

      <header class="page-header archive-head">
        <div class="archive-kicker">
          <span class="mini-seal" aria-hidden="true">藏</span>
          <span class="archive-index">09</span>
        </div>
        <h1>五术典藏</h1>
        <div class="subtitle-row">
          <span class="mini-seal" aria-hidden="true">藏</span>
          <p class="subtitle">汇古籍典藏，集百家之学</p>
        </div>
        <p class="intro">
          天地之间，学问万端。上穷玄理，下及百工，近察己身，远图生计。
          今分九类，以便采撷，各有所归，各有所用。
        </p>
        <div class="archive-rule" aria-hidden="true"></div>
        <svg class="archive-landscape" viewBox="0 0 280 120" fill="none" aria-hidden="true">
          <path d="M8 96c28-8 40-36 62-36 18 0 24 16 40 16 22 0 30-28 52-28 24 0 36 22 58 22 16 0 28-10 44-10" stroke="currentColor" stroke-width="1"/>
          <path d="M12 104c36-6 48-22 74-22 20 0 28 12 46 12 24 0 34-20 58-20 22 0 40 14 62 10" stroke="currentColor" stroke-width="1" opacity="0.7"/>
          <path d="M20 78c14 4 22-8 34-8M168 62c12 3 20-6 32-4" stroke="currentColor" stroke-width="1" opacity="0.55"/>
          <path d="M4 112h272" stroke="currentColor" stroke-width="1"/>
        </svg>
      </header>

      <form class="search-desk" id="searchForm" role="search">
        <span class="search-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="10.5" cy="10.5" r="6.25" stroke="currentColor" stroke-width="1.2"/>
            <path d="M15.2 15.2L20 20" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="text"
          id="searchInput"
          placeholder="搜索资源名称或简介关键词..."
          aria-label="搜索资源"
        />
        <button class="search-go" type="submit">检索</button>
      </form>

      <section class="category-section">

        <div class="section-heading">
          <h2>
            <svg class="heading-mark" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1"/>
              <rect x="4.5" y="4.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1"/>
            </svg>
            资源分类
          </h2>
          <span class="section-count">COLLECTION · 09</span>
        </div>

        <div class="category-grid" id="categoryGrid"></div>

      </section>

      <!-- 全部资源 -->
      <section class="resource-section">

        <div class="resource-section-title">
          <span>全部资源</span>
          <span class="resource-count" id="resourceCount"></span>
        </div>

        <div class="resource-list" id="resourceList"></div>

      </section>

      <footer class="archive-foot">
        <span class="mini-seal" aria-hidden="true">藏</span>
        <p>五术通玄明事理 · 万法归一起财门</p>
      </footer>

    </main>
  </div>

  <!-- 数据文件 -->
  <script src="../js/data.js"></script>

  <script>
    // 分类辅助说明
    const categoryDescriptions = {
      shan: "修身养性 · 传统修习",
      yi: "中医典籍 · 养生医理",
      ming: "生辰命理 · 五行术数",
      xiang: "人相手相 · 堪舆地理",
      bu: "卦象占筮 · 趋吉避凶",
      qiyi: "奇闻异录 · 百家博览",
      chuangye: "经商之道 · 创业谋略",
      jiaocheng: "实用技巧 · 技能学习",
      xuexi: "资料汇编 · 学习参考"
    };

    // 分类顺序
    const categoryOrder = [
      "shan",
      "yi",
      "ming",
      "xiang",
      "bu",
      "qiyi",
      "chuangye",
      "jiaocheng",
      "xuexi"
    ];

    const stroke = 'fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"';
    const categoryArt = {
      shan: `<svg viewBox="0 0 160 120" ${stroke}><path d="M6 98 L46 46 L68 70 L104 24 L154 98"/><path d="M18 98 L58 64 L84 82 L118 50 L148 98" opacity=".55"/><path d="M28 72c14-8 26-6 36 2M96 46c12-6 22-4 32 4" opacity=".7"/><path d="M6 98h148"/></svg>`,
      yi: `<svg viewBox="0 0 160 120" ${stroke}><path d="M54 74h40v24H54z"/><path d="M62 74V64h24v10"/><path d="M70 64h8"/><path d="M78 28c-10 8-14 18-10 30 8 2 16-2 18-10"/><path d="M86 36c14-12 32-8 36 6"/><path d="M104 22c6 8 4 16-2 22"/><path d="M108 86h22M108 92h16"/></svg>`,
      ming: `<svg viewBox="0 0 160 120" ${stroke}><circle cx="80" cy="60" r="38"/><circle cx="80" cy="60" r="16"/><path d="M80 22v76M42 60h76"/><path d="M80 46a8 8 0 1 1 0 16 4 4 0 1 0 0-8 4 4 0 1 1 0 8"/><path d="M54 34l4 4M106 34l-4 4M54 86l4-4M106 86l-4-4" opacity=".6"/></svg>`,
      xiang: `<svg viewBox="0 0 160 120" ${stroke}><path d="M8 92c18-22 28-34 46-34 10 0 16 8 28 8 16 0 22-20 40-18 12 2 18 12 30 14"/><path d="M8 100h144"/><path d="M96 28c10 8 14 20 8 32-8 4-16-2-16-12"/><path d="M92 48c8 2 14 8 12 16M100 40c6-2 12 0 14 6" opacity=".75"/></svg>`,
      bu: `<svg viewBox="0 0 160 120" ${stroke}><path d="M28 28h52M28 42h22M58 42h22M28 56h52M28 70h22M58 70h22M28 84h52"/><circle cx="112" cy="36" r="12"/><circle cx="128" cy="62" r="12"/><circle cx="108" cy="86" r="12"/><path d="M112 32v8M128 58v8M108 82v8" opacity=".7"/></svg>`,
      qiyi: `<svg viewBox="0 0 160 120" ${stroke}><path d="M36 30c-10 8-12 22-4 30 8 6 18 2 22-6V86H46c-8 0-14 6-14 12h48c0-6-6-12-14-12H54V48"/><path d="M78 40h46v52H78z"/><path d="M84 52h34M84 62h34M84 72h26" opacity=".65"/><path d="M124 40c8 0 16 6 16 16v28c0 8-6 12-14 12" opacity=".55"/></svg>`,
      chuangye: `<svg viewBox="0 0 160 120" ${stroke}><rect x="22" y="34" width="70" height="58"/><path d="M30 48h54M30 60h54M30 72h40"/><path d="M104 46h40M104 58h40M104 70h40M104 82h40"/><path d="M112 46v36M124 46v36M136 46v36" opacity=".7"/><circle cx="112" cy="52" r="2.2" fill="currentColor" stroke="none"/><circle cx="124" cy="64" r="2.2" fill="currentColor" stroke="none"/><circle cx="136" cy="58" r="2.2" fill="currentColor" stroke="none"/></svg>`,
      jiaocheng: `<svg viewBox="0 0 160 120" ${stroke}><path d="M46 96c8-28 10-48 6-70 10 8 14 22 12 40"/><path d="M40 28c8-6 16-4 18 4"/><path d="M96 28l28 64"/><path d="M90 40l22 8-8 6"/><path d="M108 96h36" opacity=".6"/></svg>`,
      xuexi: `<svg viewBox="0 0 160 120" ${stroke}><path d="M28 86V40h18c8 0 14 4 18 12 4-8 10-12 18-12h18v46"/><path d="M64 52v34M28 86h36M82 86h36"/><path d="M36 52h16M36 62h16M90 52h16M90 62h16" opacity=".6"/><path d="M22 96h116"/></svg>`
    };

    // 防止数据没有加载
    if (
      typeof categories === "undefined" ||
      typeof resources === "undefined"
    ) {
      document.getElementById("resourceList").innerHTML =
        '<div class="empty-state">资源数据加载失败，请检查 data.js 文件路径。</div>';
      throw new Error("资源数据未正确加载，请检查 data.js");
    }

    // 渲染分类
    function renderCategories() {
      const container = document.getElementById("categoryGrid");

      const sortedCategories = categoryOrder
        .map(key => categories.find(cat => cat.key === key))
        .filter(Boolean);

      container.innerHTML = sortedCategories.map((cat, index) => {
        const number = String(index + 1).padStart(2, "0");
        const description =
          categoryDescriptions[cat.key] || "典藏资源 · 分类浏览";

        return `
          <a href="${cat.key}/" class="category-card">
            <div class="category-top">
              <span class="category-number">${number}</span>
              <span class="category-seal" aria-hidden="true">藏</span>
            </div>
            <div class="category-body">
              <div class="category-copy">
                <div class="category-name">${cat.name}</div>
                <span class="category-desc">${description}</span>
              </div>
              <div class="category-art" aria-hidden="true">${categoryArt[cat.key] || ""}</div>
            </div>
            <span class="category-arrow" aria-hidden="true">
              <svg viewBox="0 0 22 22" fill="none">
                <path d="M4 11h12M12 6l5 5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        `;
      }).join("");

      if (sortedCategories.length === 0) {
        container.innerHTML =
          '<div class="empty-state">暂时没有分类数据</div>';
      }
    }

    // 渲染资源
    function renderResources(list) {
      const container = document.getElementById("resourceList");
      const count = document.getElementById("resourceCount");

      count.textContent = `共 ${list.length} 项`;

      if (list.length === 0) {
        container.innerHTML =
          '<div class="empty-state">没有找到匹配的资源</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="resource-card">

          <div class="resource-info">
            <h3>${item.title}</h3>
            <div class="meta">${item.categoryName}</div>
            <div class="desc">${item.desc}</div>
          </div>

          <div class="resource-actions">
            <a
              href="${item.link}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-primary"
            >获取资源</a>
          </div>

        </div>
      `).join("");
    }

    function applySearch(raw) {
      const keyword = String(raw || "").trim().toLowerCase();

      if (!keyword) {
        renderResources(resources);
        return;
      }

      const filtered = resources.filter(item => {
        const title = String(item.title || "").toLowerCase();
        const desc = String(item.desc || "").toLowerCase();
        const category = String(item.categoryName || "").toLowerCase();

        return (
          title.includes(keyword) ||
          desc.includes(keyword) ||
          category.includes(keyword)
        );
      });

      renderResources(filtered);
    }

    document.getElementById("searchInput")
      .addEventListener("input", function(event) {
        applySearch(event.target.value);
      });

    document.getElementById("searchForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        applySearch(document.getElementById("searchInput").value);
      });

    // 初始化
    renderCategories();
    renderResources(resources);
  </script>

  <script src="../js/nav-transition.js"></script>
  <script src="../js/mobile-nav.js"></script>
</body>
</html>
