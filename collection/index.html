<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>五术典藏_古籍典籍与传统文化资源库_庸善文化</title>
  <meta name="description" content="庸善文化五术典藏，收录山、医、命、相、卜等传统文化典籍，以及技能教程、学习资料和创业副业资源。汇古籍典藏，集百家之学。" />
  <link rel="canonical" href="https://yongshanwh.com/collection/" />
  
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../">首页</a>
        <a class="nav-item active" href="./">五术典藏</a>
        <a class="nav-item" href="../yili/">易理明辨</a>
        <a class="nav-item" href="../xuanji/">五术玄机</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>五术典藏</h1>
        <p class="subtitle">汇古籍典藏，集百家之学</p>
        <p class="intro">
          本板块系统收录山、医、命、相、卜等传统五术相关典籍，以及技能教程、学习资料与创业副业资源。
          所有资源均标注真实来源与网盘获取方式，方便爱好者学习与查阅。
        </p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索资源名称或简介关键词..." />
      </div>

      <div class="section-title" style="font-size:20px; letter-spacing:3px; margin-bottom:24px;">资源分类</div>
      <div class="category-grid" id="categoryGrid"></div>

      <div class="section-title" style="font-size:20px; letter-spacing:3px; margin:48px 0 24px;">精选资源</div>
      <div class="resource-list" id="featuredList"></div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    function getCategoryCount(key) {
      return resources.filter(r => r.category === key).length;
    }

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = categories.map(cat => `
        <a href="${cat.key}/" class="category-card">
          <h2>${cat.name}</h2>
          <div class="count">${getCategoryCount(cat.key)} 个资源</div>
          <p>${cat.desc}</p>
        </a>
      `).join('');
    }

    function renderFeatured(list = resources.slice(0, 6)) {
      const container = document.getElementById('featuredList');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-aux);">暂无匹配的资源</p>';
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="resource-card">
          <h3>${item.title}</h3>
          <div class="meta">${item.categoryName}</div>
          <div class="desc">${item.desc}</div>
          <div class="actions">
            <a href="${item.link}" target="_blank" rel="noopener" class="btn btn-primary">获取资源</a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const keyword = e.target.value.trim().toLowerCase();
      if (!keyword) {
        renderFeatured(resources.slice(0, 6));
        return;
      }
      const filtered = resources.filter(r => 
        r.title.toLowerCase().includes(keyword) || 
        r.desc.toLowerCase().includes(keyword) ||
        r.categoryName.includes(keyword)
      );
      renderFeatured(filtered);
    });

    renderCategories();
    renderFeatured();
  </script>
</body>
</html>
