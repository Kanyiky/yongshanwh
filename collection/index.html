<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五术典藏_古籍典籍与传统文化资源库_庸善文化</title>
  <meta name="description" content="庸善文化五术典藏，收录山、医、命、相、卜等传统文化典籍，以及技能教程、学习资料和创业副业资源。" />
  <link rel="canonical" href="https://yongshanwh.com/collection/" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* 古朴极简分类样式 */
    .category-section {
      margin-bottom: 48px;
    }
    .category-title {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      opacity: 0.7;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .category-grid.second-row {
      grid-template-columns: repeat(4, 1fr);
    }
    .category-card {
      background: transparent;
      border: none;
      padding: 18px 10px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s ease;
      position: relative;
    }
    .category-card h2 {
      font-size: 17px;
      letter-spacing: 6px;
      font-weight: 400;
      transition: all 0.3s ease;
    }
    .category-card:hover h2 {
      letter-spacing: 8px;
      opacity: 0.75;
    }
    .category-card::after {
      content: "";
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--text);
      opacity: 0.3;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .category-card:hover::after {
      width: 24px;
    }

    /* 资源列表微调 */
    .resource-section-title {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      opacity: 0.7;
    }
    .resource-card {
      background: transparent;
      border-radius: 0;
      padding: 20px 0;
      border-bottom: 1px solid rgba(73,55,42,0.08);
      box-shadow: none;
    }
    .resource-card:hover {
      transform: none;
      box-shadow: none;
      background: rgba(73,55,42,0.015);
    }
    .resource-card h3 {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 500;
    }
    .resource-card .meta {
      font-size: 12px;
      letter-spacing: 1px;
    }
    .resource-card .desc {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.75;
    }
    .btn-primary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(73,55,42,0.25);
      font-size: 13px;
      letter-spacing: 2px;
      padding: 6px 16px;
    }
    .btn-primary:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../">首页</a>
        <a class="nav-item active" href="./">五术典藏</a>
        <a class="nav-item" href="../yili/">易理明辨</a>
        <a class="nav-item" href="../xuanji/">五术玄机</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>五术典藏</h1>
        <p class="subtitle">汇古籍典藏，集百家之学</p>
        <p class="intro">
          天地之间，学问万端。上穷玄理，下及百工，近察己身，远图生计。今分九类，以便采撷，各有所归，各有所用。
        </p>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索资源名称或简介关键词..." />
      </div>

      <!-- 分类 -->
      <div class="category-section">
        <div class="category-title">资源分类</div>
        <div class="category-grid" id="categoryRow1"></div>
        <div class="category-grid second-row" id="categoryRow2"></div>
      </div>

      <!-- 全部资源 -->
      <div class="resource-section-title">全部资源</div>
      <div class="resource-list" id="resourceList"></div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
    function renderCategories() {
      const row1 = document.getElementById('categoryRow1');
      const row2 = document.getElementById('categoryRow2');
      
      const firstRow = ["shan", "yi", "ming", "xiang", "bu"];
      const secondRow = ["qiyi", "chuangye", "jiaocheng", "xuexi"];

      row1.innerHTML = firstRow.map(key => {
        const cat = categories.find(c => c.key === key);
        return `<a href="${cat.key}/" class="category-card"><h2>${cat.name}</h2></a>`;
      }).join('');

      row2.innerHTML = secondRow.map(key => {
        const cat = categories.find(c => c.key === key);
        return `<a href="${cat.key}/" class="category-card"><h2>${cat.name}</h2></a>`;
      }).join('');
    }

    function renderResources(list) {
      const container = document.getElementById('resourceList');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:var(--text-aux); padding:40px 0; opacity:0.6;">暂无匹配的资源</p>';
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="resource-card">
          <div class="resource-info">
            <h3>${item.title}</h3>
            <div class="meta">${item.categoryName}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="resource-actions">
            <a href="${item.link}" target="_blank" rel="noopener" class="btn btn-primary">获取资源</a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const keyword = e.target.value.trim().toLowerCase();
      if (!keyword) {
        renderResources(resources);
        return;
      }
      const filtered = resources.filter(r => 
        r.title.toLowerCase().includes(keyword) || 
        r.desc.toLowerCase().includes(keyword) ||
        r.categoryName.includes(keyword)
      );
      renderResources(filtered);
    });

    renderCategories();
    renderResources(resources);
  </script>
</body>
</html>
