<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>八字排盘_四柱大运流年_五术玄机_庸善文化</title>
  <meta name="description" content="用公历或农历排四柱。年柱月柱按节气，可选出生地经度改正真太阳时，并列出藏干、十神、纳音、大运和流年。" />
  <link rel="canonical" href="https://yongshanwh.com/xuanji/bazi/" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/modules.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item" href="../../collection/">五术典藏</a>
        <a class="nav-item" href="../../yili/">易理明辨</a>
        <a class="nav-item active" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1>八字排盘</h1>
        <p class="subtitle">四柱 · 大运 · 流年</p>
        <p class="intro">年柱、月柱按节气。23 点后默认把日柱算进下一天，可以改回当天。</p>
      </header>
      <p class="disclaimer">结果属传统文化解释体系，非科学预测。</p>
      <form id="bazi-form" class="tool-form">
        <label class="field">历法<select id="cal"><option value="solar">公历</option><option value="lunar">农历</option></select></label>
        <label class="field">年<input id="y" type="number" required></label>
        <label class="field">月<input id="m" type="number" min="1" max="12" required></label>
        <label class="field">日<input id="d" type="number" min="1" max="31" required></label>
        <label class="field">时<input id="h" type="number" min="0" max="23" required></label>
        <label class="field">分<input id="min" type="number" min="0" max="59" required></label>
        <label class="field">性别<select id="gender"><option value="male">男</option><option value="female">女</option></select></label>
        <label class="check"><input id="leap" type="checkbox"> 农历闰月</label>
        <label class="check"><input id="sect" type="checkbox"> 23 点仍算当日</label>
        <label class="check"><input id="true-sun" type="checkbox"> 用真太阳时</label>
        <label class="field">东经<input id="lon" type="number" step="0.1" value="120"></label>
        <button class="btn" type="submit">排盘</button>
        <button class="btn" type="button" id="sample-1">用例：2005-12-23 08:37 男</button>
        <button class="btn" type="button" id="sample-2">用例：1981-01-29 23:37 女</button>
      </form>
      <p class="note">真太阳时 = 北京时间 +（当地东经 − 120）× 4 分钟 + 均时差。均时差是天文近似，交界前后一两分钟可能差一个时辰。不勾选时，就用你填的钟点。</p>
      <div id="bazi-out"></div>
      <a class="back-link" href="../">← 返回五术玄机</a>
    </main>
  </div>
  <script src="../../vendor/lunar-javascript/lunar.js"></script>
  <script src="../../js/xuanji/truesun.js"></script>
  <script src="../../js/xuanji/bazi-view.js"></script>
</body>
</html>
