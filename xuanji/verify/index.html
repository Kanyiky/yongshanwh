<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>核对用例_五术玄机_庸善文化</title>
  <meta name="description" content="用固定例子核对八字、紫微、六爻、六壬和真太阳时。不过的条目会写出期望和实际。" />
  <link rel="canonical" href="https://yongshanwh.com/xuanji/verify/" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/modules.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item" href="../../collection/">五术典藏</a>
        <a class="nav-item" href="../../yili/">易理明辨</a>
        <a class="nav-item active" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1>核对用例</h1>
        <p class="subtitle">算过再显示</p>
        <p class="intro">打开这一页就会跑一遍。八字两例对 lunar-javascript 文档和立春分界，紫微两例对 iztro 文档和命身宫算法，六爻、六壬对教材里的盘。</p>
      </header>
      <p id="test-sum"></p>
      <div id="test-out"></div>
      <a class="back-link" href="../">← 返回五术玄机</a>
    </main>
  </div>
  <script src="../../vendor/lunar-javascript/lunar.js"></script>
  <script src="../../vendor/iztro/iztro.min.js"></script>
  <script src="../../js/yili/zhouyi-text.js"></script>
  <script src="../../js/yili/baihua.js"></script>
  <script src="../../js/yili/gua-logic.js"></script>
  <script src="../../js/yili/tables.js"></script>
  <script src="../../js/xuanji/truesun.js"></script>
  <script src="../../js/xuanji/liuyao.js"></script>
  <script src="../../js/xuanji/liuren.js"></script>
  <script src="../../js/xuanji/selftest.js"></script>
  <script>
    var rows = runSelfTest();
    var bad = rows.filter(function (row) { return !row.ok; }).length;
    document.getElementById("test-sum").textContent = (rows.length - bad) + " / " + rows.length + " 通过";
    document.getElementById("test-out").innerHTML = rows.map(function (row) {
      return '<div class="test-row' + (row.ok ? "" : " bad") + '">' + (row.ok ? "通过" : "失败") + " · " + row.name + (row.detail && !row.ok ? " · " + row.detail : "") + "</div>";
    }).join("");
  </script>
</body>
</html>
