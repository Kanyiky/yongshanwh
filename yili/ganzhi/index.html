<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天干地支_六十甲子与年柱_易理明辨_庸善文化</title>
  <meta name="description" content="十天干、十二地支的阴阳五行、方位、藏干和合冲刑害，六十甲子纳音，以及按立春查找年柱。" />
  <link rel="canonical" href="https://yongshanwh.com/yili/ganzhi/" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/nav-transition.css" />
  <link rel="stylesheet" href="../../css/modules.css" />
  <link rel="stylesheet" href="../../css/teach.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item" href="../../collection/">五术典藏</a>
        <a class="nav-item active" href="../../yili/">易理明辨</a>
        <a class="nav-item" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1>天干地支</h1>
        <p class="subtitle">十干 · 十二支 · 六十甲子</p>
      </header>
      <details class="fold">
        <summary>说明</summary>
        <p>拨动圆轮，十干与十二支一步一对，转出六十甲子。点一个地支，看五行、生肖、方位和月份。年柱在立春交换，不是正月初一。</p>
      </details>
      <div class="gz-wheel" id="gz-wheel"></div>
      <div class="teach-bar">
        <button type="button" class="btn" id="gz-prev">上一对</button>
        <p class="teach-step">六十甲子</p>
        <button type="button" class="btn" id="gz-next">下一对</button>
      </div>
      <div class="pair-build" id="pair-build" aria-label="已配出的甲子"></div>
      <div id="gz-detail" class="panel explain"></div>
      <details class="fold">
        <summary>六十甲子</summary>
        <div class="jiazi" id="jiazi"></div>
      </details>
      <section class="panel">
        <h2>由日期看年柱</h2>
        <form id="year-form" class="tool-form">
          <label class="field">日期<input id="year-date" type="date" required></label>
          <button class="btn" type="submit">查看</button>
        </form>
        <div id="year-out"></div>
      </section>
      <a class="back-link" href="../">← 返回易理明辨</a>
    </main>
  </div>
  <script src="../../vendor/lunar-javascript/lunar.js"></script>
  <script src="../../js/yili/tables.js"></script>
  <script src="../../js/yili/ganzhi-view.js"></script>
  <script src="../../js/nav-transition.js"></script>
</body>
</html>
