<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五行解析_生克制化与旺相休囚_易理明辨_庸善文化</title>
  <meta name="description" content="交互五行图。点一个五行，看生我、我生、克我、我克，并对照颜色、方位、季节、脏腑和旺相休囚死。" />
  <link rel="canonical" href="https://yongshanwh.com/yili/wuxing/" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/nav-transition.css" />
  <link rel="stylesheet" href="../../css/modules.css" />
  <link rel="stylesheet" href="../../css/teach.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item" href="../../collection/">五术典藏</a>
        <a class="nav-item active" href="../../yili/">易理明辨</a>
        <a class="nav-item" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1>五行解析</h1>
        <p class="subtitle">生克 · 对应 · 旺相休囚死</p>
      </header>
      <details class="fold">
        <summary>说明</summary>
        <p>实线顺着生，虚线是克。点一个字，相关的线会加重。</p>
        <p class="classic">生和克同时看，叫制化。只生不克会过，只克不生会绝。例如木克土，火是木所生，又能生土，火就把木的克泄出去，土也不至于被克尽。水克火时，土能克水，又能被火所生，同样是一边制约、一边接住。</p>
        <p>这里只说明这个关系，不据此推断人事吉凶。</p>
      </details>
      <div class="wuxing-layout">
        <div id="wx-svg"></div>
        <p class="wx-legend"><span><i></i>相生</span><span><i class="ke-key"></i>相克</span></p>
        <div id="wx-text" class="explain"></div>
      </div>
      <section class="panel wx-quiz" aria-live="polite">
        <h2>试一试</h2>
        <p class="wx-q" id="wx-q"></p>
        <div class="wx-choices" id="wx-choices"></div>
        <p class="wx-feedback" id="wx-feedback"></p>
      </section>
      <section class="panel">
        <h2>旺相休囚死</h2>
        <div class="season-slider">
          <p class="season-now" id="season-now">春</p>
          <input class="season-range" id="season" type="range" min="0" max="4" step="1" value="0" aria-label="季节">
          <div class="season-scale"><span>春</span><span>夏</span><span>秋</span><span>冬</span><span>四季</span></div>
        </div>
        <div id="wang"></div>
        <details class="fold"><summary>说明</summary><p>当令的为旺，我生的为相，生我的为休，克我的为囚，我克的为死。春指寅卯月，夏巳午月，秋申酉月，冬亥子月。四季指辰戌丑未月，土旺。</p></details>
      </section>
      <a class="back-link" href="../">← 返回易理明辨</a>
    </main>
  </div>
  <script src="../../js/yili/tables.js"></script>
