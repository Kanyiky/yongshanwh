<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六十四卦_文王卦序与八宫_易理明辨_庸善文化</title>
  <meta name="description" content="六十四卦按文王卦序或京房八宫排列。点开可见卦画、卦辞、彖传、象传、爻辞，以及错卦、综卦、互卦和变卦。" />

  <link rel="stylesheet" href="../../css/style.css" />

  <link rel="stylesheet" href="../../css/modules.css" />

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <nav class="nav">
        <a class="nav-item" href="../../">首页</a>
        <a class="nav-item" href="../../collection/">五术典藏</a>
        <a class="nav-item active" href="../../yili/">易理明辨</a>
        <a class="nav-item" href="../../xuanji/">五术玄机</a>
      </nav>
    </aside>
    <main class="main">
      <header class="page-header">
        <h1>六十四卦</h1>
        <p class="subtitle">卦画 · 经文 · 错综互变</p>
      </header>
      <details class="fold">
        <summary>说明</summary>
        <p>经文用维基文库《周易》的公开文本，已改成简体。白话释义另写在下面，和经文分开。没有把握的白话会标成「待补」，不另编句子。</p>
        <p>异文写在卦的末尾。革卦「己日」、损卦初九「已事」没有照抄维基文库的用字，原因也写在那里。</p>
      </details>
      <section class="teach" id="gua-teach" aria-label="卦象演练">
        <div class="teach-bar">
          <button type="button" class="btn" id="gua-prev">上一步</button>
          <p class="teach-step" id="gua-step">第1步 · 阴阳</p>
          <button type="button" class="btn" id="gua-next">下一步</button>
        </div>
        <div id="gua-stage"></div>
      </section>
      <h2 class="block-title">六十四卦全图</h2>
      <div class="switch">
        <button type="button" class="btn active" id="mode-wen">文王卦序</button>
        <button type="button" class="btn" id="mode-gong">八宫</button>
      </div>
      <div id="board"></div>
      <div id="detail" class="panel" hidden></div>
      <a class="back-link" href="../">← 返回易理明辨</a>
    </main>
  </div>

</body>
