<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庸善文化 · 探五术之理，寻万法之源</title>
  <style>
    :root {
      --bg: #F6F0E5; --card: #F6F0E5; --sub-bg: #F6F0E5;
      --text: #49372A; --text-secondary: #49372A; --text-aux: #49372A;
      --accent: #49372A; --accent-dark: #49372A; --gold: #49372A; --border: rgba(73,55,42,.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 17px; }
    body {
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      background-color: var(--bg); color: var(--text);
      line-height: 1.75; overflow-x: hidden;
    }
     body::before {
      content: ""; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }
    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    .sidebar {
      width: 240px; background: var(--card); border-right: 1px solid var(--border);
      padding: 48px 22px; position: fixed; top: 0; left: 0; height: 100vh;
      display: flex; flex-direction: column; z-index: 100;
    }
    .brand { text-align: center; margin-bottom: 52px; }
    .brand-name {
      font-family: "LiSu", "STLiti", "华文隶书", "KaiTi", serif;
      font-size: 36px; color: var(--text); letter-spacing: 6px; line-height: 1.2;
    }
    .brand-line { width: 56px; height: 1px; background: var(--gold); margin: 18px auto 0; opacity: .8; }
    .nav { display: flex; flex-direction: column; gap: 10px; }
    .nav-item {
      position: relative; display: flex; align-items: center; justify-content: center;
      padding: 15px 18px; border-radius: 8px; color: var(--text-secondary);
      text-decoration: none; font-size: 18px; letter-spacing: 6px; text-indent: 6px;
      transition: all .25s ease; cursor: pointer; border: 1px solid transparent;
    }
    .nav-item::before {
      content: ""; position: absolute; left: 12px; top: 50%; width: 5px; height: 5px;
      border-radius: 50%; background: var(--gold); opacity: 0; transform: translateY(-50%);
      transition: opacity .25s;
    }
    .nav-item:hover { background: var(--sub-bg); color: var(--text); }
    .nav-item:hover::before { opacity: .5; }
    .nav-item.active {
      background: var(--sub-bg); color: var(--accent); border-color: var(--border); font-weight: 600;
    }
    .nav-item.active::before { opacity: 1; background: var(--accent); }

    .main { margin-left: 240px; flex: 1; padding: 40px 40px 80px; max-width: 1440px; }

    .home-hero {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
      align-items: center; min-height: 700px; margin-bottom: 72px;
    }
    .hero-text { padding-left: 8px; padding-bottom: 12vh; position: relative; z-index: 2; }
    .hero-title {
      position: relative;
      font-size: clamp(42px, 4.4vw, 68px); font-weight: 400; letter-spacing: 0;
      line-height: 1; margin-bottom: 30px; color: var(--text);
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .stele-lines { display: flex; flex-direction: column; gap: 0.06em; }
    .stele-line { display: flex; align-items: flex-end; }
    .stele-line + .stele-line { margin-left: 0.72em; }
    .glyph { width: 1em; height: 1.05em; display: block; overflow: visible; }
    .glyph path { fill: currentColor; }
    .hero-title.fake-li {
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
      font-weight: 900; -webkit-text-stroke: 1.8px var(--text);
    }
    .hero-title.fake-li span { transform: scaleX(1.2); transform-origin: left center; }
    .hero-title span { display: block; white-space: nowrap; }
    .hero-title span + span { padding-left: 1em; }
    .hero-title span + span::first-letter { color: var(--accent); }
    .hero-line { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .hero-line::before { content: ""; width: 10px; height: 10px; background: var(--accent); transform: rotate(45deg); }
    .hero-line::after { content: ""; width: 96px; height: 1.5px; background: linear-gradient(90deg, var(--gold), transparent); }
    .hero-subtitle {
      font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "DFKai-SB", "Noto Serif SC", serif;
      font-size: 22px; color: var(--text-secondary); letter-spacing: 5px; line-height: 2.2;
    }
    .hero-subtitle span { display: block; }
    .hero-subtitle span + span { padding-left: 1.2em; }

    .visual-wrap { width: 100%; max-width: 700px; justify-self: center; margin-top: 12px; transform: translateX(4%); }
    .visual-device { width: 100%; aspect-ratio: 1; position: relative; }
    .device-bg {
      position: absolute; inset: 4%; border-radius: 50%;
      background: radial-gradient(circle, rgba(178,138,69,.10) 0%, transparent 70%);
    }
    .compass { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
    .compass line, .compass circle, .compass path { fill: none; }
    .compass .ln { stroke: var(--border); stroke-width: 1; }
    .compass .gd { stroke: var(--gold); stroke-width: 1.2; }
    .compass .yao { stroke: var(--text); stroke-linecap: butt; }
    .compass text { text-anchor: middle; dominant-baseline: central; font-family: inherit; }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--gold); }
    .card {
      position: relative; padding: 40px 36px 36px; cursor: pointer;
      border-left: 1px solid var(--border); transition: background .35s ease;
      text-decoration: none; color: inherit; display: block;
    }
    .card:first-child { border-left: none; padding-left: 8px; }
    .card:hover { background: linear-gradient(180deg, rgba(178,138,69,.07), transparent 70%); }
    .card-title {
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      font-size: 28px; font-weight: 900; letter-spacing: 8px; margin-bottom: 14px;
      transition: color .3s ease;
    }
    .card:hover .card-title { color: var(--accent); }
    .card-sub { font-size: 15px; color: var(--gold); letter-spacing: 2px; margin-bottom: 18px; }
    .card-sub::after {
      content: ""; display: block; width: 28px; height: 1px; background: var(--gold);
      margin-top: 18px; transition: width .35s ease;
    }
    .card:hover .card-sub::after { width: 64px; }
    .card-desc { font-size: 16px; color: var(--text-secondary); line-height: 1.95; }
    .footer-idea { margin-top: 100px; text-align: center; padding-top: 40px; border-top: 1px solid var(--border); }
    .footer-idea p { font-size: 18px; letter-spacing: 5px; color: var(--text-secondary); }

    @media (max-width: 1280px) {
      .home-hero { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 1100px) {
      .home-hero { grid-template-columns: 1fr; gap: 24px; }
      .visual-wrap { width: min(100%, 640px); transform: none; }
      .hero-text { padding-bottom: 0; }
      .cards { grid-template-columns: 1fr; }
      .card, .card:first-child { border-left: none; padding: 32px 4px; border-top: 1px solid var(--border); }
      .card:first-child { border-top: none; }
    }
    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; padding: 24px 16px; border-right: none; border-bottom: 1px solid var(--border); }
      .main { margin-left: 0; padding: 32px 20px 60px; }
      .brand { margin-bottom: 22px; }
      .brand-name { font-size: 30px; }
      .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .nav-item { padding: 11px 4px; font-size: 15px; letter-spacing: 2px; text-indent: 2px; }
      .nav-item::before { display: none; }
      .hero-title { font-size: 46px; letter-spacing: 4px; }
      .hero-subtitle { font-size: 19px; letter-spacing: 3px; }
    }
    @media (max-width: 420px) { .nav { grid-template-columns: repeat(2, 1fr); } }

    body::before, .device-bg { display: none; }
    .sidebar { background: transparent; }
    .nav-item { opacity: .55; background: transparent !important; border-color: transparent !important; }
    .nav-item:hover { opacity: 1; }
    .nav-item::before { display: none; }
    .nav-item.active { opacity: 1; font-weight: 700; box-shadow: inset 2px 0 0 var(--text); border-radius: 0; }
    .brand-line { opacity: .5; }
    .hero-line::before { display: none; }
    .hero-line::after { width: 64px; height: 1px; background: var(--text); opacity: .5; }
    .hero-title span + span::first-letter { color: inherit; }
    .hero-subtitle, .card-desc, .card-sub, .footer-idea p { opacity: .72; }
    .cards { border-top: 1px solid var(--text); }
    .card:hover { background: none; }
    .card:hover .card-title { color: var(--text); text-decoration: underline; text-underline-offset: 10px; text-decoration-thickness: 1px; }
    .card-sub::after { display: none; }
    .compass text { text-rendering: geometricPrecision; }
    .gz {
      display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 34px;
      font-size: 22px; font-weight: 400; letter-spacing: 12px; text-indent: 12px;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif; opacity: .85;
    }
    .gz i { display: block; width: 1px; height: 14px; background: var(--text); opacity: .35; }
    @media (max-width: 768px) { .gz { font-size: 18px; gap: 16px; letter-spacing: 6px; text-indent: 6px; } }
  </style>

  <link rel="stylesheet" href="css/mobile.css" />
</head>

  <script>
    (function () {
      const T = { Q:[1,1,1], D:[1,1,0], L:[1,0,1], Z:[1,0,0], X:[0,1,1], N:[0,1,0], G:[0,0,1], K:[0,0,0] };
      const BAGUA = [['Q','乾'],['D','兑'],['L','离'],['Z','震'],['X','巽'],['N','坎'],['G','艮'],['K','坤']];
      const SHICHEN = '子丑寅卯辰巳午未申酉戌亥'.split('');
      const PAIRS = ('QQ KK NZ GN NQ QN KN NK XQ QD KQ QK QL LQ KG ZK DZ GX KD XK LZ GL GK KZ ' +
        'QZ GQ GZ DX NN LL DG ZX QG ZQ LK KL XL LD NG ZN GD XZ DQ QX DK KX DN NX DL LX ' +
        'ZZ GG XG ZD ZL LG XX DD XN ND XD ZG NL LN').split(' ');
      const NAMES = ('乾 坤 屯 蒙 需 讼 师 比 小畜 履 泰 否 同人 大有 谦 豫 随 蛊 临 观 噬嗑 贲 剥 复 ' +
        '无妄 大畜 颐 大过 坎 离 咸 恒 遁 大壮 晋 明夷 家人 睽 蹇 解 损 益 夬 姤 萃 升 困 井 ' +
        '革 鼎 震 艮 渐 归妹 丰 旅 巽 兑 涣 节 中孚 小过 既济 未济').split(' ');
      const GAN = '甲乙丙丁戊己庚辛壬癸', ZHI = '子丑寅卯辰巳午未申酉戌亥';
      const JZ = i => GAN[i % 10] + ZHI[i % 12];
      const cn = n => { const d = '零一二三四五六七八九';
        if (n < 10) return d[n];
        const t = Math.floor(n / 10), u = n % 10;
        return (t === 1 ? '十' : d[t] + '十') + (u ? d[u] : ''); };
      const rot = (a, inner) => `<g transform="rotate(${a})">${inner}</g>`;
      const yao = (y, on, w, sw) => on
        ? `<line class="yao" x1="${-w/2}" x2="${w/2}" y1="${y}" y2="${y}" stroke-width="${sw}"/>`
        : `<line class="yao" x1="${-w/2}" x2="${-w*0.12}" y1="${y}" y2="${y}" stroke-width="${sw}"/>` +
          `<line class="yao" x1="${w*0.12}" x2="${w/2}" y1="${y}" y2="${y}" stroke-width="${sw}"/>`;

      const RINGS = [
        { n: 8,  step: 45,    r: 98,  fs: 15,   op: .9,  txt: i => BAGUA[i][1] },
        { n: 64, step: 5.625, r: 240, fs: 11.5, op: .55, txt: i => NAMES[i] },
        { n: 12, step: 30,    r: 132, fs: 23,   op: .9,  txt: i => SHICHEN[i] },
        { n: 24, step: 15,    r: 280, fs: 15,   op: .72, txt: cn },
        { n: 60, step: 6,     r: 326, fs: 13.5, op: .56, txt: JZ },
        { n: 60, step: 6,     r: 368, fs: 13,   op: .42, txt: JZ }
      ];

      let bgG = '', hxG = '';
      BAGUA.forEach(([k], i) => {
        let g = ''; T[k].forEach((v, j) => { g += yao(-(58 + j * 8), v, 22, 3); });
        bgG += rot(i * 45, g);
      });
      for (let i = 0; i < 64; i++) {
        let g = ''; T[PAIRS[i][1]].concat(T[PAIRS[i][0]]).forEach((v, k) => { g += yao(-(166 + k * 7.6), v, 10, 2.4); });
        hxG += rot(i * 5.625, g);
      }

      let ticks = '';
      for (let i = 0; i < 60; i++) {
        const long = i % 5 === 0;
        ticks += rot(i * 6, `<line y1="-397" y2="${long ? -388 : -392}" stroke-width="${long ? .9 : .6}"/>`);
      }

      let s = `<defs><radialGradient id="wash"><stop offset="0" style="stop-color:var(--text);stop-opacity:.07"/>` +
        `<stop offset=".75" style="stop-color:var(--text);stop-opacity:.025"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></radialGradient></defs>` +
        `<circle r="398" style="fill:url(#wash);stroke:none"/>` +
        `<g stroke="var(--text)" opacity=".5">${ticks}</g>`;

      RINGS.forEach((R, k) => {
        let g = '';
        if (k === 0) g += `<g opacity=".9">${bgG}</g>`;
        if (k === 1) g += `<g opacity=".7">${hxG}</g>`;
        for (let i = 0; i < R.n; i++) {
          const b = +(i * R.step).toFixed(4);
          g += `<g transform="rotate(${b}) translate(0,${-R.r})"><text font-size="${R.fs}" fill="var(--text)" fill-opacity="${R.op}" ` +
            `style="transform:rotate(calc(var(--nt) - ${b}deg))">${R.txt(i)}</text></g>`;
        }
        s += `<g id="ring${k}">${g}</g>`;
      });

      s += `<g><circle r="34" style="fill:var(--bg);stroke:var(--text);stroke-width:.9"/>` +
        `<path d="M0,-34 A34,34 0 0 1 0,34 A17,17 0 0 1 0,0 A17,17 0 0 0 0,-34Z" style="fill:var(--text);stroke:none"/>` +
        `<circle cy="-17" r="4.2" style="fill:var(--text);stroke:none"/><circle cy="17" r="4.2" style="fill:var(--bg);stroke:none"/>` +
        `<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></g>`;

      s += `<defs><linearGradient id="ptr-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="355" y2="0">` +
        `<stop offset="0" style="stop-color:var(--text);stop-opacity:0"/>` +
        `<stop offset=".12" style="stop-color:var(--text);stop-opacity:.9"/>` +
        `<stop offset=".8" style="stop-color:var(--text);stop-opacity:.9"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></linearGradient>` +
        `<linearGradient id="ptr-b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="355" y2="0">` +
        `<stop offset="0" style="stop-color:var(--text);stop-opacity:0"/>` +
        `<stop offset=".3" style="stop-color:var(--text);stop-opacity:.09"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></linearGradient></defs>` +
        `<line x1="0" x2="355" y1="0" y2="0" stroke="url(#ptr-b)" stroke-width="7"/>` +
        `<line x1="0" x2="355" y1="0" y2="0" stroke="url(#ptr-g)" stroke-width=".8"/>`;

      const svg = document.getElementById('compass');
      svg.innerHTML = s;
      const rings = RINGS.map((_, k) => document.getElementById('ring' + k));

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let hover = false;
      svg.addEventListener('mouseenter', () => { hover = true; svg.pauseAnimations(); });
      svg.addEventListener('mouseleave', () => { hover = false; if (!reduce) svg.unpauseAnimations(); });
      if (reduce) svg.pauseAnimations();

      let a1 = 0, a2 = 0, prev = performance.now();
      function frame(now) {
        const dt = Math.max(0, (now - prev) / 1000); prev = now;
        if (!hover && !reduce) { a1 = (a1 + dt * 360 / 90) % 360; a2 = (a2 + dt * 360 / 200) % 360; }
        const n = new Date();
        const sec = n.getSeconds() + n.getMilliseconds() / 1000;
        const min = n.getMinutes() + sec / 60;
        const hour = n.getHours() + min / 60;
        const th = [a1, a2, 90 - (hour / 2) * 30, 90 - (hour - 0.5) * 15, 90 - (min - 0.5) * 6, 90 - (sec - 0.5) * 6];
        for (let k = 0; k < 6; k++) {
          rings[k].setAttribute('transform', `rotate(${th[k]})`);
          rings[k].style.setProperty('--nt', `${-th[k]}deg`);
        }
        if (!reduce) requestAnimationFrame(frame);
      }
      frame(performance.now());
      if (reduce) setInterval(() => frame(performance.now()), 1000);

      function pillars(dt) {
        const yr = dt.getFullYear(), mo = dt.getMonth() + 1, d = dt.getDate(), key = mo * 100 + d;
        const B = [204, 306, 405, 506, 606, 707, 808, 908, 1008, 1107, 1207];
        let Y = yr, m = 0;
        if (key >= 204) B.forEach((b, i) => { if (key >= b) m = i; });
        else { Y = yr - 1; m = key >= 106 ? 11 : 10; }
        const ys = ((Y - 4) % 10 + 10) % 10, yb = ((Y - 4) % 12 + 12) % 12;
        const ms = ((ys % 5) * 2 + 2 + m) % 10, mb = (2 + m) % 12;
        const days = Math.round((Date.UTC(yr, mo - 1, d) - Date.UTC(2000, 0, 1)) / 864e5);
        const di = ((54 + days) % 60 + 60) % 60;
        return [GAN[ys] + ZHI[yb], GAN[ms] + ZHI[mb], GAN[di % 10] + ZHI[di % 12]];
      }
      const gz = document.getElementById('gz');
      function updateGz() {
        const [y, m, d] = pillars(new Date());
        const t = `<span>${y}</span><i></i><span>${m}</span><i></i><span>${d}</span>`;
        if (gz.innerHTML !== t) gz.innerHTML = t;
      }
      updateGz(); setInterval(updateGz, 1000);
    })();

  </script>
  <script src="js/nav-transition.js"></script>
  <script src="js/mobile-nav.js"></script>
</body>
