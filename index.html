<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>庸善文化 · 探五術之理，溯萬法之源</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --text: #49372A;
      --bg: #F6F0E5;
    }
    body:has(#compass) .main {
      width: min(1240px, calc(100% - 48px));
      max-width: none;
      padding-top: calc(var(--bar-h) + 8px);
      padding-bottom: 40px;
    }
    .home-hero {
      display: grid;
      grid-template-columns: minmax(300px, 0.86fr) minmax(440px, 1.14fr);
      gap: 36px 48px;
      align-items: center;
      min-height: calc(100dvh - var(--bar-h) - 120px);
      margin-bottom: 28px;
    }
    .hero-text { padding: 0 0 4vh; position: relative; z-index: 2; }
    .hero-title {
      position: relative;
      font-family: "AoyagiReisho", "FZFangSong", "Songti SC", serif;
      font-size: clamp(46px, 4.6vw, 76px);
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1.35;
      margin-bottom: 28px;
      color: var(--text);
    }
    .hero-title span { display: block; white-space: nowrap; }
    .hero-title span + span { padding-left: 1em; }
    .hero-line { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .hero-line::after { content: ""; width: 72px; height: 1px; background: var(--text); opacity: .45; }
    .hero-subtitle {
      font-family: "FZFangSong", "Songti SC", "SimSun", "Noto Serif SC", serif;
      font-size: 18px;
      color: var(--text-secondary);
      letter-spacing: 0.22em;
      line-height: 2.15;
    }
    .hero-subtitle span { display: block; }
    .hero-subtitle span + span { padding-left: 1.2em; }

    .visual-wrap { width: 100%; max-width: 640px; justify-self: center; }
    .visual-device { width: 100%; aspect-ratio: 1; position: relative; }
    .compass { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
    .compass line, .compass circle, .compass path { fill: none; }
    .compass .ln, .compass .gd, .compass .yao { stroke: #49372A; stroke-linecap: butt; }
    .compass .ln { stroke-width: 1; }
    .compass .gd { stroke-width: 1.2; }
    .compass text {
      text-anchor: middle;
      dominant-baseline: central;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      text-rendering: geometricPrecision;
    }
    .gz {
      display: flex; justify-content: center; align-items: center; gap: 28px; margin-bottom: 12px;
      font-size: 18px; font-weight: 400; letter-spacing: 0.42em; text-indent: 0.42em;
      font-family: "FZFangSong", "Songti SC", "Noto Serif SC", serif;
      color: var(--text);
      opacity: .8;
    }
    .gz i { display: block; width: 1px; height: 14px; background: var(--text); opacity: .35; }
    .footer-idea { margin-top: 12px; text-align: center; padding-top: 28px; border-top: 1px solid rgba(73, 55, 42, 0.18); }
    .footer-idea p { font-size: 16px; letter-spacing: 0.32em; color: var(--text-secondary); }

    @media (max-width: 980px) {
      .home-hero { grid-template-columns: 1fr; min-height: 0; gap: 12px; }
      .hero-text { padding-bottom: 0; text-align: center; }
      .hero-title span { width: max-content; max-width: 100%; margin-inline: auto; }
      .hero-title span + span, .hero-subtitle span + span { padding-left: 0; }
      .hero-line { justify-content: center; }
      .visual-wrap { max-width: 560px; }
    }

  </style>
  <link rel="stylesheet" href="css/nav-transition.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">庸善文化</div>
        <div class="brand-line"></div>
      </div>
      <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="菜单">
      <label class="menu-btn" for="nav-toggle"><span></span><span></span><span class="sr">菜单</span></label>
      <nav class="nav">
        <a class="nav-item active" href="./" title="首页">首页</a>
        <a class="nav-item" href="collection/" title="五术典藏">五术典藏</a>
        <a class="nav-item" href="yili/" title="易理明辨">易理明辨</a>
        <a class="nav-item" href="xuanji/" title="五术玄机">五术玄机</a>
      </nav>
    </aside>

    <main class="main">
      <section class="page active">
        <div class="home-hero">
          <div class="hero-text">
            <h1 class="hero-title"><span>探五術之理</span><span>溯萬法之源</span></h1>
            <div class="hero-line"></div>
            <p class="hero-subtitle">
              <span>溯古籍之源，明阴阳之理，</span>
              <span>研传统之术，承东方之智慧。</span>
            </p>
          </div>
          <div class="visual-wrap">
            <div class="gz" id="gz"></div>
            <div class="visual-device">
              <div class="device-bg"></div>
              <svg id="compass" class="compass" viewBox="-400 -400 800 800" aria-label="镂空罗盘"></svg>
            </div>
          </div>
        </div>

        <div class="footer-idea">
          <p>五术通玄明事理 · 万法归一起财门</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const T = { Q:[1,1,1], D:[1,1,0], L:[1,0,1], Z:[1,0,0], X:[0,1,1], N:[0,1,0], G:[0,0,1], K:[0,0,0] };
      const BAGUA = [['Q','乾'],['D','兑'],['L','离'],['Z','震'],['X','巽'],['N','坎'],['G','艮'],['K','坤']];
      const SHICHEN = '子丑寅卯辰巳午未申酉戌亥'.split('');
      const PAIRS = ('QQ KK NZ GN NQ QN KN NK XQ QD KQ QK QL LQ KG ZK DZ GX KD XK LZ GL GK KZ ' +
        'QZ GQ GZ DX NN LL DG ZX QG ZQ LK KL XL LD NG ZN GD XZ DQ QX DK KX DN NX DL LX ' +
        'ZZ GG XG ZD ZL LG XX DD XN ND XD ZG NL LN').split(' ');
      const NAMES = ('乾 坤 屯 蒙 需 讼 师 比 小畜 履 泰 否 同人 大有 谦 豫 随 蛊 临 观 噬嗑 贲 剥 复 ' +
        '无妄 大畜 颐 大过 坎 离 咸 恒 遁 大壮 晋 明夷 家人 睽 蹇 解 损 益 夬 姤 萃 升 困 井 ' +
        '革 鼎 震 艮 渐 归妹 丰 旅 巽 兑 涣 节 中孚 小过 既济 未济').split(' ');
      const GAN = '甲乙丙丁戊己庚辛壬癸', ZHI = '子丑寅卯辰巳午未申酉戌亥';
      const JZ = i => GAN[i % 10] + ZHI[i % 12];
      const cn = n => { const d = '零一二三四五六七八九';
        if (n < 10) return d[n];
        const t = Math.floor(n / 10), u = n % 10;
        return (t === 1 ? '十' : d[t] + '十') + (u ? d[u] : ''); };
      const rot = (a, inner) => `<g transform="rotate(${a})">${inner}</g>`;
      const yao = (y, on, w, sw) => on
        ? `<line class="yao" x1="${-w/2}" x2="${w/2}" y1="${y}" y2="${y}" stroke-width="${sw}"/>`
        : `<line class="yao" x1="${-w/2}" x2="${-w*0.12}" y1="${y}" y2="${y}" stroke-width="${sw}"/>` +
          `<line class="yao" x1="${w*0.12}" x2="${w/2}" y1="${y}" y2="${y}" stroke-width="${sw}"/>`;

      const RINGS = [
        { n: 8,  step: 45,    r: 98,  fs: 15,   op: .9,  txt: i => BAGUA[i][1] },
        { n: 64, step: 5.625, r: 240, fs: 11.5, op: .55, txt: i => NAMES[i] },
        { n: 12, step: 30,    r: 132, fs: 23,   op: .9,  txt: i => SHICHEN[i] },
        { n: 24, step: 15,    r: 280, fs: 15,   op: .72, txt: cn },
        { n: 60, step: 6,     r: 326, fs: 13.5, op: .56, txt: JZ },
        { n: 60, step: 6,     r: 368, fs: 13,   op: .42, txt: JZ }
      ];

      let bgG = '', hxG = '';
      BAGUA.forEach(([k], i) => {
        let g = ''; T[k].forEach((v, j) => { g += yao(-(58 + j * 8), v, 22, 3); });
        bgG += rot(i * 45, g);
      });
      for (let i = 0; i < 64; i++) {
        let g = ''; T[PAIRS[i][1]].concat(T[PAIRS[i][0]]).forEach((v, k) => { g += yao(-(166 + k * 7.6), v, 10, 2.4); });
        hxG += rot(i * 5.625, g);
      }

      let ticks = '';
      for (let i = 0; i < 60; i++) {
        const long = i % 5 === 0;
        ticks += rot(i * 6, `<line y1="-397" y2="${long ? -388 : -392}" stroke-width="${long ? .9 : .6}"/>`);
      }

      let s = `<defs><radialGradient id="wash"><stop offset="0" style="stop-color:var(--text);stop-opacity:.07"/>` +
        `<stop offset=".75" style="stop-color:var(--text);stop-opacity:.025"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></radialGradient></defs>` +
        `<circle r="398" style="fill:url(#wash);stroke:none"/>` +
        `<g stroke="var(--text)" opacity=".5">${ticks}</g>`;

      RINGS.forEach((R, k) => {
        let g = '';
        if (k === 0) g += `<g opacity=".9">${bgG}</g>`;
        if (k === 1) g += `<g opacity=".7">${hxG}</g>`;
        for (let i = 0; i < R.n; i++) {
          const b = +(i * R.step).toFixed(4);
          g += `<g transform="rotate(${b}) translate(0,${-R.r})"><text font-size="${R.fs}" fill="var(--text)" fill-opacity="${R.op}" ` +
            `style="transform:rotate(calc(var(--nt) - ${b}deg))">${R.txt(i)}</text></g>`;
        }
        s += `<g id="ring${k}">${g}</g>`;
      });

      s += `<g><circle r="34" style="fill:var(--bg);stroke:var(--text);stroke-width:.9"/>` +
        `<path d="M0,-34 A34,34 0 0 1 0,34 A17,17 0 0 1 0,0 A17,17 0 0 0 0,-34Z" style="fill:var(--text);stroke:none"/>` +
        `<circle cy="-17" r="4.2" style="fill:var(--text);stroke:none"/><circle cy="17" r="4.2" style="fill:var(--bg);stroke:none"/>` +
        `<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></g>`;

      s += `<defs><linearGradient id="ptr-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="355" y2="0">` +
        `<stop offset="0" style="stop-color:var(--text);stop-opacity:0"/>` +
        `<stop offset=".12" style="stop-color:var(--text);stop-opacity:.9"/>` +
        `<stop offset=".8" style="stop-color:var(--text);stop-opacity:.9"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></linearGradient>` +
        `<linearGradient id="ptr-b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="355" y2="0">` +
        `<stop offset="0" style="stop-color:var(--text);stop-opacity:0"/>` +
        `<stop offset=".3" style="stop-color:var(--text);stop-opacity:.09"/>` +
        `<stop offset="1" style="stop-color:var(--text);stop-opacity:0"/></linearGradient></defs>` +
        `<line x1="0" x2="355" y1="0" y2="0" stroke="url(#ptr-b)" stroke-width="7"/>` +
        `<line x1="0" x2="355" y1="0" y2="0" stroke="url(#ptr-g)" stroke-width=".8"/>`;

      const svg = document.getElementById('compass');
      svg.innerHTML = s;
      const rings = RINGS.map((_, k) => document.getElementById('ring' + k));

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let hover = false;
      svg.addEventListener('mouseenter', () => { hover = true; svg.pauseAnimations(); });
      svg.addEventListener('mouseleave', () => { hover = false; if (!reduce) svg.unpauseAnimations(); });
      if (reduce) svg.pauseAnimations();

      let a1 = 0, a2 = 0, prev = performance.now();
      function frame(now) {
        const dt = Math.max(0, (now - prev) / 1000); prev = now;
        if (!hover && !reduce) { a1 = (a1 + dt * 360 / 90) % 360; a2 = (a2 + dt * 360 / 200) % 360; }
        const n = new Date();
        const sec = n.getSeconds() + n.getMilliseconds() / 1000;
        const min = n.getMinutes() + sec / 60;
        const hour = n.getHours() + min / 60;
        const th = [a1, a2, 90 - (hour / 2) * 30, 90 - (hour - 0.5) * 15, 90 - (min - 0.5) * 6, 90 - (sec - 0.5) * 6];
        for (let k = 0; k < 6; k++) {
          rings[k].setAttribute('transform', `rotate(${th[k]})`);
          rings[k].style.setProperty('--nt', `${-th[k]}deg`);
        }
        if (!reduce) requestAnimationFrame(frame);
      }
      frame(performance.now());
      if (reduce) setInterval(() => frame(performance.now()), 1000);

      function pillars(dt) {
        const yr = dt.getFullYear(), mo = dt.getMonth() + 1, d = dt.getDate(), key = mo * 100 + d;
        const B = [204, 306, 405, 506, 606, 707, 808, 908, 1008, 1107, 1207];
        let Y = yr, m = 0;
        if (key >= 204) B.forEach((b, i) => { if (key >= b) m = i; });
        else { Y = yr - 1; m = key >= 106 ? 11 : 10; }
        const ys = ((Y - 4) % 10 + 10) % 10, yb = ((Y - 4) % 12 + 12) % 12;
        const ms = ((ys % 5) * 2 + 2 + m) % 10, mb = (2 + m) % 12;
        const days = Math.round((Date.UTC(yr, mo - 1, d) - Date.UTC(2000, 0, 1)) / 864e5);
        const di = ((54 + days) % 60 + 60) % 60;
        return [GAN[ys] + ZHI[yb], GAN[ms] + ZHI[mb], GAN[di % 10] + ZHI[di % 12]];
      }
      const gz = document.getElementById('gz');
      function updateGz() {
        const [y, m, d] = pillars(new Date());
        const t = `<span>${y}</span><i></i><span>${m}</span><i></i><span>${d}</span>`;
        if (gz.innerHTML !== t) gz.innerHTML = t;
      }
      updateGz(); setInterval(updateGz, 1000);
    })();

  </script>
  <script src="js/nav-transition.js"></script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
